name: Dependency validation
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - run: 'dotnet build Fumilume.slnx -c Release

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        dotnet test --project tests/Fumilume.Tests/Fumilume.Tests.csproj -c Release --no-build

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
  macos:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - run: dotnet build tests/Fumilume.MacE2E/Fumilume.MacE2E.csproj -c Release -p:FumilumeTargetMac=true
