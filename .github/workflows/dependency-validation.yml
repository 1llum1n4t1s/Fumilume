name: Dependency validation
# 通常の変更（main への push と全 PR）と Dependabot・手動実行で、Windows の単体テストと
# macOS 向け E2E プロジェクトのビルドを走らせる。ファイル名は従来のまま（呼び出し・参照を壊さないため）。
# 対象外: 実アプリ経路の Mac E2E（有効なディスプレイが要る）と Native AOT 発行・署名・公証は
# macos-release.yml が配信時に行う。ここで走らせるのは軽い検証だけにする。
# 全ジョブが GitHub 提供ランナー（公開リポジトリなので使用料なし）で動く。
'on':
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: R2 transfer mock checks
      shell: pwsh
      run: ./tests/R2Transfer/Run.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'fumilume-r2-transfer')
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: global.json
    - name: Restore NuGet package cache
      id: nuget-cache
      if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-
          ${{ runner.os }}-nuget-
    - run: 'dotnet build Fumilume.slnx -c Release

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        dotnet test --solution Fumilume.slnx -c Release --no-build

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Save NuGet package cache
      if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: R2 transfer mock checks
      shell: pwsh
      run: ./tests/R2Transfer/Run.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'fumilume-r2-transfer')
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
      with:
        global-json-file: global.json
    - name: Restore NuGet package cache
      id: nuget-cache
      if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-dependency-validation-${{ github.job }}-
          ${{ runner.os }}-nuget-
    - run: dotnet build tests/Fumilume.MacE2E/Fumilume.MacE2E.csproj -c Release -p:FumilumeTargetMac=true
    - name: Save NuGet package cache
      if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
