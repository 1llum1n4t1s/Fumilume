name: Dependency validation
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: R2 transfer mock checks
      shell: pwsh
      run: ./tests/R2Transfer/Run.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'fumilume-r2-transfer')
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - run: 'dotnet build Fumilume.slnx -c Release

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        dotnet test --solution Fumilume.slnx -c Release --no-build

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
  macos:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, m3mb14]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: R2 transfer mock checks
      shell: pwsh
      run: ./tests/R2Transfer/Run.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'fumilume-r2-transfer')
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json
    - run: dotnet build tests/Fumilume.MacE2E/Fumilume.MacE2E.csproj -c Release -p:FumilumeTargetMac=true
