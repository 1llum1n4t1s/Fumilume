name: macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fumilume-macos-release
  cancel-in-progress: false

jobs:
  package:
    outputs:
      artifact-attempt: ${{ steps.artifact-attempt.outputs['attempt'] }}
    runs-on: [self-hosted, macOS, ARM64, m3mb14, fumilume-isolated]
    timeout-minutes: 90
    steps:
      - name: 外部作業先を設定
        run: echo "FUMILUME_WORK_ROOT=$RUNNER_TEMP/Codex/Fumilume/release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: R2 transfer mock checks
        shell: pwsh
        run: ./tests/R2Transfer/Run.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'fumilume-r2-transfer')
      - name: Apple Silicon runner を確認
        run: test "$(uname -m)" = arm64
      - name: 固定 .NET SDK を導入
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windows = $env:RUNNER_OS -eq 'Windows'
          $sdkVersion = $null
          if (Test-Path global.json) {
            $settings = Get-Content global.json -Raw | ConvertFrom-Json -AsHashtable
            if ($settings.ContainsKey('sdk') -and $settings['sdk'] -is [Collections.IDictionary] -and $settings['sdk'].ContainsKey('version')) {
              $sdkVersion = [string]$settings['sdk']['version']
            }
          }
          $dotnet = $null
          $existing = Get-Command dotnet -CommandType Application -ErrorAction SilentlyContinue
          if ($existing -and $sdkVersion) {
            $global:LASTEXITCODE = 0
            $availableVersion = & $existing.Source --version 2>$null
            if ($LASTEXITCODE -eq 0 -and ($availableVersion -join "`n").Trim() -ceq $sdkVersion) {
              $executable = Get-Item -LiteralPath $existing.Source
              $resolved = $executable.ResolveLinkTarget($true)
              $dotnet = if ($resolved) { $resolved.FullName } else { $executable.FullName }
              $install = Split-Path -Parent $dotnet
            }
          }
          if (-not $dotnet) {
            $extension = if ($windows) { 'ps1' } else { 'sh' }
            $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.$extension"
            Invoke-WebRequest "https://dot.net/v1/dotnet-install.$extension" -OutFile $installer
            $install = Join-Path $env:RUNNER_TEMP 'dotnet'
            $global:LASTEXITCODE = 0
            if ($windows) {
              if ($sdkVersion) { & $installer -Version $sdkVersion -InstallDir $install }
              else { & $installer -Channel '10.0' -InstallDir $install }
            } else {
              if ($sdkVersion) { & bash $installer --version $sdkVersion --install-dir $install }
              else { & bash $installer --channel '10.0' --install-dir $install }
            }
            if ($LASTEXITCODE -ne 0) { throw '.NET SDK installation failed' }
            $dotnetName = if ($windows) { 'dotnet.exe' } else { 'dotnet' }
            $dotnet = Join-Path $install $dotnetName
          }
          if (-not (Test-Path -LiteralPath $dotnet -PathType Leaf)) { throw '.NET SDK executable is missing' }
          $actualVersion = & $dotnet --version
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK version check failed' }
          if ($sdkVersion -and ($actualVersion -join "`n").Trim() -cne $sdkVersion) { throw '.NET SDK version differs from global.json' }
          Write-Output $actualVersion
          & $dotnet --info
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK runtime check failed' }
          $install | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$install" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: 実アプリ経路の E2E 検証
        run: |
          dotnet restore tests/Fumilume.MacE2E/Fumilume.MacE2E.csproj -p:FumilumeTargetMac=true --locked-mode --artifacts-path "$FUMILUME_WORK_ROOT/build-e2e"
          dotnet run --project tests/Fumilume.MacE2E -p:FumilumeTargetMac=true -c Release --no-restore --artifacts-path "$FUMILUME_WORK_ROOT/build-e2e" -- "$FUMILUME_WORK_ROOT/e2e"
      - name: Native AOT 発行・署名・公証・起動検証
        env:
          APPLE_CERT_APP_P12_BASE64: ${{ secrets.APPLE_CERT_APP_P12_BASE64 }}
          APPLE_CERT_INSTALLER_P12_BASE64: ${{ secrets.APPLE_CERT_INSTALLER_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
          APPLE_SIGN_INSTALL_IDENTITY: ${{ secrets.APPLE_SIGN_INSTALL_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/build-macos-arm64.sh
      - name: 更新フィードとパッケージの取得を検証
        run: dotnet run --project tests/Fumilume.MacE2E -p:FumilumeTargetMac=true -c Release --no-build --artifacts-path "$FUMILUME_WORK_ROOT/build-e2e" -- --verify-updates "$FUMILUME_WORK_ROOT/packages" "$FUMILUME_WORK_ROOT/verification/update-sdk"
      # 配信は署名済み artifact の検証後に既存の R2 配布経路で行う。
      - name: 配布物を保存
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'velopack.osx-arm64' -Path '${{ env.FUMILUME_WORK_ROOT }}/packages/*' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: 検証記録を保存
        if: ${{ github.event_name != 'pull_request' && (always()) }}
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          $candidates = @('${{ env.FUMILUME_WORK_ROOT }}/e2e/', '${{ env.FUMILUME_WORK_ROOT }}/verification/native-launch/', '${{ env.FUMILUME_WORK_ROOT }}/verification/installed-launch/', '${{ env.FUMILUME_WORK_ROOT }}/verification/update-apply/', '${{ env.FUMILUME_WORK_ROOT }}/verification/notarization/', '${{ env.FUMILUME_WORK_ROOT }}/verification/SHA256SUMS', '${{ env.FUMILUME_WORK_ROOT }}/verification/distribution.json', '${{ env.FUMILUME_WORK_ROOT }}/verification/update-sdk/update-results.json')
          $diagnostics = @(foreach ($path in $candidates) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              if ((Get-Item -LiteralPath $path).Length -gt 0) { $path }
            } elseif (Test-Path -LiteralPath $path -PathType Container) {
              if (@(Get-ChildItem -LiteralPath $path -File -Recurse -Force).Count -gt 0) { $path }
            }
          })
          if ($diagnostics.Count -gt 0) {
            Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'verification.osx-arm64' -Path $diagnostics | Out-Null
          } else {
            Write-Warning 'No diagnostic files were produced; the original job result is preserved.'
          }
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
